<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="svg20"
   sodipodi:docname="icon.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview20"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.59375"
     inkscape:cx="256"
     inkscape:cy="256"
     inkscape:window-width="1920"
     inkscape:window-height="1012"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg20" />
  <!--
    TrueEconomy icon.
    A trading column: three stacked bars under a rising price line. Reads as both "market chart" and
    "stack of goods". Flat, no isometric, so it stays legible at 32px where a plugin icon is
    actually seen.
  -->
  <defs
     id="defs13">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#1b2a22"
         id="stop1" />
      <stop
         offset="0.55"
         stop-color="#14201a"
         id="stop2" />
      <stop
         offset="1"
         stop-color="#0d1511"
         id="stop3" />
    </linearGradient>
    <linearGradient
       id="barGreen"
       x1="0"
       y1="1"
       x2="0"
       y2="0">
      <stop
         offset="0"
         stop-color="#1f9c4d"
         id="stop4" />
      <stop
         offset="1"
         stop-color="#3ddc7a"
         id="stop5" />
    </linearGradient>
    <linearGradient
       id="barGold"
       x1="465.92744"
       y1="265.38038"
       x2="465.92744"
       y2="172.77369"
       gradientTransform="matrix(0.69109474,0,0,3.1272884,0,-445.92098)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#c9a227"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#ffd75e"
         id="stop7" />
    </linearGradient>
    <linearGradient
       id="barBlue"
       x1="392"
       y1="219.42857"
       x2="392"
       y2="107.42857"
       gradientTransform="matrix(0.57142857,0,0,1.8116247,0,-13.522209)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#1a7f9e"
         id="stop8" />
      <stop
         offset="1"
         stop-color="#37c6e8"
         id="stop9" />
    </linearGradient>
    <linearGradient
       id="line"
       x1="0"
       y1="1"
       x2="1"
       y2="0">
      <stop
         offset="0"
         stop-color="#ffd75e"
         id="stop10" />
      <stop
         offset="1"
         stop-color="#3ddc7a"
         id="stop11" />
    </linearGradient>
    <linearGradient
       id="rim"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#4fe39a"
         stop-opacity="0.85"
         id="stop12" />
      <stop
         offset="1"
         stop-color="#37c6e8"
         stop-opacity="0.2"
         id="stop13" />
    </linearGradient>
  </defs>
  <rect
     width="512"
     height="512"
     rx="96"
     fill="url(#bg)"
     id="rect13" />
  <g
     stroke="#2f4a3c"
     stroke-width="3"
     opacity="0.55"
     id="g22"
     transform="translate(-1.254902,-75.294118)">
    <line
       x1="104"
       y1="180"
       x2="408"
       y2="180"
       id="line20" />
    <line
       x1="104"
       y1="256"
       x2="408"
       y2="256"
       id="line21" />
    <line
       x1="104"
       y1="332"
       x2="408"
       y2="332"
       id="line22" />
  </g>
  <rect
     x="6"
     y="6"
     width="500"
     height="500"
     rx="92"
     fill="none"
     stroke="url(#rim)"
     stroke-width="5"
     opacity="0.5"
     id="rect14" />
  <!-- faint chart grid -->
  <g
     stroke="#2f4a3c"
     stroke-width="3"
     opacity="0.55"
     id="g16">
    <line
       x1="104"
       y1="180"
       x2="408"
       y2="180"
       id="line14" />
    <line
       x1="104"
       y1="256"
       x2="408"
       y2="256"
       id="line15" />
    <line
       x1="104"
       y1="332"
       x2="408"
       y2="332"
       id="line16" />
  </g>
  <!-- baseline -->
  <rect
     x="104"
     y="384"
     width="304"
     height="9"
     rx="4.5"
     fill="#33503f"
     id="rect16" />
  <!-- bars, increasing then dipping, so the line above them reads as a trend -->
  <rect
     x="126"
     y="294"
     width="64"
     height="90"
     rx="11"
     fill="url(#barGreen)"
     id="rect17" />
  <rect
     x="224"
     y="181.09804"
     width="64"
     height="202.90196"
     rx="11"
     fill="url(#barBlue)"
     id="rect18"
     style="fill:url(#barBlue);stroke-width:1.01745" />
  <rect
     x="322"
     y="94.392159"
     width="64"
     height="289.60785"
     rx="11"
     fill="url(#barGold)"
     id="rect19"
     style="fill:url(#barGold);stroke-width:1.47012" />
  <!-- rising price line, kept clear of the frame -->
  <path
     d="M120 316 L188 262 L256 214 L324 166 L400 116"
     fill="none"
     stroke="url(#line)"
     stroke-width="17"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="path19" />
  <ellipse
     cx="114.66666"
     cy="323.84314"
     fill="#ffd75e"
     stroke="#12201a"
     stroke-width="8.18326"
     id="circle19"
     rx="19.241703"
     ry="21.751507" />
  <circle
     cx="400"
     cy="116"
     r="21"
     fill="#3ddc7a"
     stroke="#12201a"
     stroke-width="7"
     id="circle20" />
</svg>
