<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>TrueEconomy 2.0 — feature sheet</title>
  <desc>1280x720 feature sheet. Counts are checked against source by verify-claims.sh.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16241d"/>
      <stop offset="0.52" stop-color="#101b16"/>
      <stop offset="1" stop-color="#0a110e"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.08" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#3ddc7a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ddc7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#37c6e8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#37c6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc7a"/>
      <stop offset="0.55" stop-color="#37c6e8"/>
      <stop offset="1" stop-color="#ffd75e"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g stroke="#1e2f26" stroke-width="1" opacity="0.45">
    <path d="M80 0 V720 M280 0 V720 M480 0 V720 M680 0 V720 M880 0 V720 M1080 0 V720 M1280 0 V720"/>
    <path d="M0 80 H1280 M0 200 H1280 M0 320 H1280 M0 440 H1280 M0 560 H1280 M0 680 H1280"/>
  </g>
  <rect width="1280" height="720" fill="url(#glowGreen)"/>
  <rect width="1280" height="720" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#rule)"/>

  <!-- ============ header ============ -->
  <text x="80" y="86" font-family="Inter, DejaVu Sans, sans-serif" font-size="15"
        font-weight="700" letter-spacing="3.4" fill="#3ddc7a">FEATURE SHEET · 2.0.0</text>
  <text x="80" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="46"
        font-weight="800" letter-spacing="-1.2" fill="#eafff2">A living economy, not a balance file</text>
  <text x="80" y="182" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5"
        font-weight="500" fill="#93c4a4">Supply and demand, escrowed auctions, credit-scored banking, city taxes and 734 shop entries — all in the GUI.</text>

  <rect x="1090" y="58" width="110" height="30" rx="15" fill="#12241b" stroke="#2f6b4c" stroke-width="1.5"/>
  <text x="1145" y="78" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="13" font-weight="700" letter-spacing="0.6" fill="#8ee6a8">1.8 → 26.3</text>

  <!-- ============ card 1 ============ -->
  <g transform="translate(80,212)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#3ddc7a"/>
    <g transform="translate(24,24)" fill="none" stroke="#3ddc7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 31 H32"/>
      <path d="M6 25 L14 17 L20 22 L30 9" stroke-width="2.7"/>
      <path d="M25 9 H30 V14"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Dynamic market</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">65 commodities with base</text>
      <text x="24" y="113">price, elasticity, supply</text>
      <text x="24" y="134">and demand. Player trades</text>
      <text x="24" y="155">move the number.</text>
    </g>
  </g>

  <!-- ============ card 2 ============ -->
  <g transform="translate(365,212)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#37c6e8"/>
    <g transform="translate(24,24)" fill="none" stroke="#37c6e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="28" height="21" rx="3"/>
      <path d="M4 18 H32"/>
      <path d="M15 18 V23 H21 V18"/>
      <path d="M11 11 C11 5 25 5 25 11"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Shop catalog</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">27 categories and 734</text>
      <text x="24" y="113">entries. Finite stock, a</text>
      <text x="24" y="134">buy-sell spread, custom</text>
      <text x="24" y="155">items and timed sales.</text>
    </g>
  </g>

  <!-- ============ card 3 ============ -->
  <g transform="translate(650,212)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#ffd75e"/>
    <g transform="translate(24,24)" fill="none" stroke="#ffd75e" stroke-width="2.4" stroke-linejoin="round">
      <path d="M6 7 H20 L33 20 L20 33 L7 20 Z"/>
      <circle cx="13" cy="14" r="2.2" fill="#ffd75e" stroke="none"/>
      <path d="M19 12 L27 20" stroke-linecap="round"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Auction house</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">Buy-it-now and escrowed</text>
      <text x="24" y="113">bidding, minimum</text>
      <text x="24" y="134">increments, fees, tax and</text>
      <text x="24" y="155">one-click claiming.</text>
    </g>
  </g>

  <!-- ============ card 4 ============ -->
  <g transform="translate(935,212)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#b07de8"/>
    <g transform="translate(24,24)" fill="none" stroke="#b07de8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14 L18 5 L32 14 Z"/>
      <path d="M7 17 V29 M14 17 V29 M22 17 V29 M29 17 V29"/>
      <path d="M4 32 H32"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Banking &amp; credit</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">Wallet/bank split,</text>
      <text x="24" y="113">compounding interest,</text>
      <text x="24" y="134">credit-scored loans and</text>
      <text x="24" y="155">default penalties.</text>
    </g>
  </g>

  <!-- ============ card 5 ============ -->
  <g transform="translate(80,426)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#e8894a"/>
    <g transform="translate(24,24)" fill="none" stroke="#e8894a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 32 V15 H31 V32"/>
      <path d="M3 15 L7 6 H29 L33 15"/>
      <path d="M3 15 H33"/>
      <path d="M9 22 H16 V32 M20 22 H27 V32"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Player shops</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">Create a shop, hire up to 5</text>
      <text x="24" y="113">employees, set wages and</text>
      <text x="24" y="134">track production, revenue</text>
      <text x="24" y="155">and profit.</text>
    </g>
  </g>

  <!-- ============ card 6 ============ -->
  <g transform="translate(365,426)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#3ddc7a"/>
    <g transform="translate(24,24)" fill="none" stroke="#3ddc7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 4 V30 M8 30 H28"/>
      <path d="M6 9 H30"/>
      <path d="M6 9 V13 M30 9 V13"/>
      <path d="M2 13 H10 L6 20 Z"/>
      <path d="M26 13 H34 L30 20 Z"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Government</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">Transaction tax feeds city</text>
      <text x="24" y="113">treasuries and grants.</text>
      <text x="24" y="134">Seasonal crisis and boom</text>
      <text x="24" y="155">events reprice the market.</text>
    </g>
  </g>

  <!-- ============ card 7 ============ -->
  <g transform="translate(650,426)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#37c6e8"/>
    <g transform="translate(24,24) rotate(-45 18 18)" fill="none" stroke="#37c6e8" stroke-width="2.6">
      <rect x="2" y="13" width="17" height="10" rx="5"/>
      <rect x="17" y="13" width="17" height="10" rx="5"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Identity linking</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">Tie Java UUID and Bedrock</text>
      <text x="24" y="113">XUID with a 6-character</text>
      <text x="24" y="134">code. Currency, bank and</text>
      <text x="24" y="155">discoveries merge.</text>
    </g>
  </g>

  <!-- ============ card 8 ============ -->
  <g transform="translate(935,426)">
    <rect width="265" height="194" rx="18" fill="#0d1914" stroke="#26402f" stroke-width="2"/>
    <rect x="0" y="22" width="4" height="150" rx="2" fill="#ffd75e"/>
    <g transform="translate(24,24)" fill="none" stroke="#ffd75e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="28" height="24" rx="4"/>
      <path d="M9 24 L15 17 L20 21 L27 12"/>
      <circle cx="27" cy="12" r="2" fill="#ffd75e" stroke="none"/>
    </g>
    <text x="72" y="50" font-family="Inter, DejaVu Sans, sans-serif" font-size="18.5"
          font-weight="700" fill="#eafff2">Built to observe</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="14.2" font-weight="500" fill="#bcd8c7">
      <text x="24" y="92">26 achievements, daily</text>
      <text x="24" y="113">streaks, 16 GUI screens and</text>
      <text x="24" y="134">27 logged transaction types.</text>
      <text x="24" y="155">YAML, SQLite or MySQL.</text>
    </g>
  </g>

  <!-- ============ footer ============ -->
  <path d="M80 650 H1200" stroke="#1e2f26" stroke-width="1.5"/>
  <text x="80" y="682" font-family="Inter, DejaVu Sans, sans-serif" font-size="14"
        font-weight="500" fill="#6f9c82">TrueEconomy 2.0.0   ·   65 commodities   ·   734 shop entries   ·   26 achievements   ·   237 tests   ·   68 builds</text>
  <text x="1200" y="682" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.4" fill="#4f6f5d">BY SNIPERNODE</text>
</svg>
